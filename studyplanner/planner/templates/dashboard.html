{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner - Dashboard</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="dashboard-container">
    <header class="dashboard-header">
      <h1>Study Dashboard</h1>
      <button id="logoutBtn">Logout</button>
    </header>

    <section class="add-section">
      <h2>Add New Study Plan</h2>
      <form id="addPlanForm">
        <input type="text" id="courseTitle" placeholder="Course Title" required>
        <input type="text" id="planTitle" placeholder="Plan/Task Title" required>
        <input type="date" id="planDate" required>
        <button type="submit">Add Plan</button>
      </form>
      <div id="addMessage"></div>
    </section>

    <section class="plans-section">
      <h2>Your Study Plans</h2>
      <div id="plansContainer">
        <!-- Dynamic cards -->
      </div>
    </section>
  </div>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
